name: 打包 macOS

# 推到 main 或手动触发时，在 GitHub 的 Mac 机器上打出通用版 dmg（Apple Silicon + Intel）。
# 公共仓库的标准 runner 免费，但仍只改 Markdown 的提交不打包，避免无谓排队。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    name: dmg（通用版）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Tauri CLI
        run: npm ci --no-audit --no-fund

      # 单元测试在 Mac 上也跑一遍（端到端测试需要邮件服务器，默认跳过）
      - name: 测试
        run: |
          npm test
          cargo test -p mailpulse-app

      # 没有 Apple 开发者证书，用 ad-hoc 签名（tauri.conf.json 里的 signingIdentity "-"）。
      # 不能完全不签：Apple Silicon 上没签名的 App 下载后会被提示「已损坏」。
      - name: 打包
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 检查签名
        run: codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/MailBeacon.app

      - uses: actions/upload-artifact@v4
        with:
          name: MailBeacon-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
