name: 检查

# 仅在发往 main 的 PR 创建或更新时，以及手动运行时检查，避免分支推送重复执行；
# main 上的测试与打包由 release.yml 负责。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 测试与构建检查
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Tauri CLI
        run: npm ci --no-audit --no-fund

      - name: 版本与更新记录
        run: node scripts/release.js check

      - name: 前端测试
        run: npm test

      - name: 格式与构建检查
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked

      - name: Rust 单元测试
        run: cargo test -p mailbeacon-app --locked
