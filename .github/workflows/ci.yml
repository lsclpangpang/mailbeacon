name: 检查

# 仅在 PR 创建或更新时，以及手动运行时检查（也覆盖叠加 PR），避免分支推送重复执行；
# main 上的测试与打包由 release.yml 负责。
on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_release_probe:
        description: '额外复现指定 Windows 已发布安装包的账户流程，如 v0.18.0（不跳过常规检查）'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.windows_release_probe || 'current' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 测试与构建检查
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Tauri CLI
        run: npm ci --no-audit --no-fund

      - name: 版本与更新记录
        run: node scripts/release.js check

      - name: 前端测试
        run: npm test

      - name: 格式与构建检查
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked

      - name: Rust 单元测试
        run: cargo test -p mailbeacon-app --locked

  windows:
    name: Windows 测试与安装包
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Tauri CLI
        run: npm ci --no-audit --no-fund

      - name: 版本与前端测试
        run: |
          node scripts/release.js check
          npm run test:windows

      - name: 验证 Windows 路径与快捷方式
        shell: pwsh
        run: |
          . ./scripts/windows-file-identity.ps1
          Test-WindowsFileIdentity | ConvertTo-Json -Depth 6

      - name: Windows 构建与单元测试
        run: |
          cargo check --workspace --locked
          cargo test -p mailbeacon-app --locked

      - name: 构建 Windows x64 安装包
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: 安装与首次启动冒烟检查
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer.' }
          ./scripts/windows-smoke.ps1 -Installer $installer[0].FullName

          $report = Get-Content -Raw 'windows-smoke-results/smoke-result.json' | ConvertFrom-Json
          if ($report.pe.sizeOfStackReserve -ne 8388608) { throw 'Installed application did not retain its configured 8 MiB main-thread stack reserve.' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MailBeacon-Windows-smoke
          path: windows-smoke-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: MailBeacon-Windows-x64-preview
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  windows-release-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_release_probe != ''
    name: Windows 已发布安装包账户复现
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 验证已发布安装包的完整账户流程
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_TAG: ${{ inputs.windows_release_probe }}
        run: |
          if ($env:PROBE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a published semantic version tag.' }
          $download = Join-Path $env:RUNNER_TEMP 'published-installer'
          gh release download $env:PROBE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*_x64-setup.exe' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Published installer download failed.' }
          $installer = @(Get-ChildItem -LiteralPath $download -Filter '*_x64-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one published x64 installer.' }
          ./scripts/windows-smoke.ps1 -Installer $installer[0].FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MailBeacon-Windows-account-repro
          path: windows-smoke-results/
          if-no-files-found: warn
