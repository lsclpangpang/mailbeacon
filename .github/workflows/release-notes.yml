name: 更新发布说明

# 只改了 CHANGELOG.md 时，「发布 macOS」不会运行（它忽略 .md 改动）。
# 这里只刷新当前版本已有 release 的说明，不重新打包；还没有这个版本的 release 时什么都不做。
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

# 单独排队：不能和「发布 macOS」共用一个队列，否则排队中的打包会被这里顶掉
concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: 刷新 release 说明
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 更新说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # 这次推送还改了代码时，「发布 macOS」打包完会写说明，这里不用管
          if [ "${{ github.event_name }}" = push ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qv '\.md$'; then
            echo "这次推送还改了代码，说明由「发布 macOS」更新"
            exit 0
          fi
          node scripts/release.js check
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            node scripts/release.js notes auto > release-notes.md
            gh release edit "$tag" --notes-file release-notes.md
            echo "已更新 $tag 的说明"
          else
            echo "还没有 $tag 的 release，等「发布 macOS」创建"
          fi
