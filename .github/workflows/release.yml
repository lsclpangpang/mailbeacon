name: 发布

# PR 合并到 main 后，只计算和回写一次版本；两个平台构建相同提交后统一发布。
# 手动运行按 main 当前版本重打包；不能用不同提交覆盖同一个已发布 tag。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: 准备版本
    if: github.ref == 'refs/heads/main'
    # 专用 key 仅此 job 可见，此环境只允许 main。
    environment: release-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.prepared.outputs.sha }}
      version: ${{ steps.prepared.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 排队期间的合并一起规划，最终输出准确 SHA，后续不再读取移动中的 main。
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 根据 PR 标题确定版本
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          else
            version=$(node scripts/release.js plan)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 把版本号提交回 main
        if: steps.plan.outputs.version != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: bash scripts/release-writeback.sh

      - name: 固定两个平台的版本和提交
        id: prepared
        if: steps.plan.outputs.version != ''
        run: |
          set -eu
          node scripts/release.js check
          # 回写重试可能在更新的 main 上重新规划，必须读取最终版本。
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    name: 构建 macOS
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 测试
        run: |
          npm ci --no-audit --no-fund
          node scripts/release.js check
          npm test
          cargo test -p mailbeacon-app --locked

      - name: 打包与检查签名
        run: |
          npx tauri build --target universal-apple-darwin --bundles app,dmg
          codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/MailBeacon.app
          node scripts/release-artifacts.js record target/universal-apple-darwin/release/bundle/dmg macOS

      - uses: actions/upload-artifact@v4
        with:
          name: MailBeacon-macOS
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/manifest.json
          if-no-files-found: error

  windows:
    name: 构建 Windows
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 测试
        run: |
          npm ci --no-audit --no-fund
          node scripts/release.js check
          npm test
          cargo test -p mailbeacon-app --locked

      - name: 验证 Windows 路径与快捷方式
        shell: pwsh
        run: |
          . ./scripts/windows-file-identity.ps1
          Test-WindowsFileIdentity | ConvertTo-Json -Depth 6

      - name: 打包 Windows x64
        run: |
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
          node scripts/release-artifacts.js record target/x86_64-pc-windows-msvc/release/bundle/nsis Windows

      - name: 安装与首次启动冒烟检查
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer.' }
          ./scripts/windows-smoke.ps1 -Installer $installer[0].FullName

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MailBeacon-Windows-smoke
          path: windows-smoke-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: MailBeacon-Windows
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/manifest.json
          if-no-files-found: error

  publish:
    name: 发布两个平台安装包
    needs: [prepare, macos, windows]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      TARGET: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: MailBeacon-macOS
          path: installers/macOS

      - uses: actions/download-artifact@v4
        with:
          name: MailBeacon-Windows
          path: installers/Windows

      - name: 核对并发布
        run: |
          set -euo pipefail
          node scripts/release-artifacts.js verify installers
          tag="v$RELEASE_VERSION"
          dmg="installers/macOS/MailBeacon_${RELEASE_VERSION}_universal.dmg"
          exe="installers/Windows/MailBeacon_${RELEASE_VERSION}_x64-setup.exe"
          node scripts/release.js notes auto > release-notes.md
          tagSha=""
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            tagSha=$(git rev-list -n 1 "$tag")
            if [ "$tagSha" != "$TARGET" ]; then
              echo "拒绝用不同提交覆盖已有 tag：$tag" >&2
              exit 1
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # 新建草稿后上传失败时，tag 可能尚未创建；只允许同一提交的草稿续传。
            if [ -z "$tagSha" ]; then
              draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
              targetCommit=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
              if [ "$draft" != true ] || [ "$targetCommit" != "$TARGET" ]; then
                echo "已有 release 缺少匹配的 tag 或草稿提交" >&2
                exit 1
              fi
            fi
            gh release upload "$tag" "$dmg" "$exe" --clobber
            gh release edit "$tag" --title "MailBeacon $RELEASE_VERSION" --notes-file release-notes.md --draft=false
          else
            # 两个文件上传成功后才公开 release，失败时保留草稿便于重试。
            gh release create "$tag" "$dmg" "$exe" --draft \
              --target "$TARGET" --title "MailBeacon $RELEASE_VERSION" --notes-file release-notes.md
            gh release edit "$tag" --draft=false
          fi
          gh release view "$tag" --json url,tagName,assets
