name: 发布 macOS

# PR 合并进 main 后，按 PR 标题决定版本（fix → 末位，feat → 中间位，带 ! → 首位，
# docs/test/ci 等不发版），改好版本号和 CHANGELOG.md 并提交回 main，然后测试、
# 打出通用版 dmg（Apple Silicon + Intel），发布为新的 v<version> Release。
# PR 里手动提高了版本号时按那个版本发。手动运行本工作流则按当前版本重新打包，覆盖已有 release 的 dmg。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# 发布不能被新推送取消，排队执行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 打包并发布 dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # 取 main 的最新提交而不是触发时的提交：排队期间的合并一起发布，推回版本号也不会落后
          ref: ${{ github.ref }}
          # 需要历史 tag 来确定新版本号、生成「完整变更」链接
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 根据 PR 标题确定版本
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "手动运行：按当前版本 $version 重新打包"
          else
            # 上一个 tag 之后合并的所有 PR 一起算：排队时被合并掉的发布、上次没发成的发布都会补上
            version=$(node scripts/release.js plan)
          fi
          if [ -z "$version" ]; then
            echo "这次不发新版本（上一个 tag 之后没有 fix / feat / 重大变更的 PR）"
          else
            echo "发布版本：$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 版本号和更新记录先提交回 main，tag 打在这个提交上。
      # 用 GITHUB_TOKEN 推送不会再次触发工作流；打包失败时 main 上已是新版本号但没有 tag，
      # 下次发布会把它和之后的 PR 一起重新计算。
      - name: 把版本号提交回 main
        id: commit
        if: steps.plan.outputs.version != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git diff --quiet; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            git commit -qam "chore(release): v$version"
            if git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 这期间 main 又有新提交：不变基（版本号那几行一定冲突），换到最新的 main 上重新计算
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ -z "$(node scripts/release.js plan)" ]; then
              echo "最新的 main 上已经没有要发布的内容（可能已被别的发布带上），不再发布" >&2
              exit 1
            fi
          done
          echo "推送版本号到 main 失败" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@1.99.0
        if: steps.plan.outputs.version != ''
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.version != ''

      - name: 安装 Tauri CLI
        if: steps.plan.outputs.version != ''
        run: npm ci --no-audit --no-fund

      # 版本号不一致或 CHANGELOG.md 没写这一版时直接失败，不打包
      - name: 检查版本与更新记录
        if: steps.plan.outputs.version != ''
        run: node scripts/release.js check

      # 发版前先在 Mac 上也跑一遍测试（端到端测试需要邮件服务器，默认跳过）
      - name: 测试
        if: steps.plan.outputs.version != ''
        run: |
          npm test
          cargo test -p mailpulse-app --locked

      # 没有 Apple 开发者证书，用 ad-hoc 签名（tauri.conf.json 里的 signingIdentity "-"）。
      # 不能完全不签：Apple Silicon 上没签名的 App 下载后会被提示「已损坏」。
      - name: 打包
        if: steps.plan.outputs.version != ''
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: 检查签名
        if: steps.plan.outputs.version != ''
        run: codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/MailBeacon.app

      - name: 发布到 GitHub Releases
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.commit.outputs.sha || github.sha }}
        run: |
          set -eu
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          # 说明用 main 上最新的 CHANGELOG.md：打包期间有人只改了更新记录时，不会被这次的旧内容覆盖
          git fetch -q origin main && git show origin/main:CHANGELOG.md > CHANGELOG.md || true
          # 说明里的「完整变更」和比本次小的最新版本比较
          node scripts/release.js notes auto > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "更新已有 release $tag 的安装包和说明"
            gh release upload "$tag" "$dmg" --clobber
            gh release edit "$tag" --title "MailBeacon $version" --notes-file release-notes.md
          else
            echo "创建 release $tag"
            # tag 打在带新版本号的那个提交上（排队期间 main 可能又有新提交）
            gh release create "$tag" "$dmg" \
              --target "$TARGET" \
              --title "MailBeacon $version" \
              --notes-file release-notes.md
          fi
          gh release view "$tag" --json url,tagName,assets -q '"release: \(.url)"'

      # 即使 release 已存在也保留 Actions 产物，方便在页面上直接下载本次构建
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.version != ''
        with:
          name: MailBeacon-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
