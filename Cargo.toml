[workspace]
resolver = "3"
members = ["cli", "src-tauri"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# macOS: notify-rust must wait_for_click so notification taps reach on_action
# (see vendor/notify-rust/MAILBEACON-PATCH.md).
[patch.crates-io]
notify-rust = { path = "vendor/notify-rust" }

