[package]
name = "mailbeacon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
chrono = "0.4.45"
futures = "0.3.34"
mailbeacon-parser = { path = "../vendor/mail-parser", features = ["full_encoding"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = "0.26"
toml = "1.1.8"
webpki-roots = "1.0.9"
