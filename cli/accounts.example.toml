# 复制为 accounts.toml 后填写。accounts.toml 已在 .gitignore 中，不会被提交。
# 密码一律填「授权码 / 应用专用密码」，不是网页登录密码：
#   QQ 邮箱:     网页版 设置 → 账号 → 开启 IMAP/SMTP 服务 → 生成授权码
#   163 邮箱:    网页版 设置 → POP3/SMTP/IMAP → 开启 IMAP → 新增授权密码
#   腾讯企业邮:  网页版 设置 → 客户端设置 → 开启 IMAP；若开了「安全登录」，需生成客户端专用密码
#   Gmail:       需先开两步验证，再到 https://myaccount.google.com/apppasswords 生成应用专用密码
#
# 也可以不写 password，改用 password_cmd 从钥匙串读取，例如 macOS：
#   password_cmd = "security find-generic-password -s mailpulse-qq -w"

# 支持 IDLE 时，每隔多少秒重发一次 IDLE（顺便兜底检查一次）
idle_refresh_secs = 300
# 不支持 IDLE（或 mode = "poll"）时的轮询间隔
poll_secs = 15

[[account]]
name = "企业邮"
kind = "exmail"            # exmail | qq | 163 | gmail | custom
user = "you@yourcompany.com"
password = "客户端专用密码"

[[account]]
name = "QQ"
kind = "qq"
user = "12345678@qq.com"
password = "授权码"

[[account]]
name = "163"
kind = "163"
user = "you@163.com"
password = "授权码"

[[account]]
name = "Gmail"
kind = "gmail"
user = "you@gmail.com"
password = "应用专用密码"
# 可选：同时监听多个文件夹（每个文件夹一条连接）
# folders = ["INBOX"]
# 可选：强制轮询，用来跟 IDLE 做对比
# mode = "poll"

# 其他邮箱：
# [[account]]
# name = "自定义"
# kind = "custom"
# host = "imap.example.com"
# port = 993
# user = "..."
# password = "..."
