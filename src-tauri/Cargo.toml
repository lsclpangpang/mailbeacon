[package]
name = "mailpulse-app"
description = "MailPulse 邮件客户端"
version = "0.1.0"
edition = "2024"

[lib]
# _lib 后缀：避免库名与二进制同名冲突，见 https://github.com/rust-lang/cargo/issues/8519
name = "mailpulse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
anyhow = "1"
base64 = "0.22"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
chrono = "0.4"
dirs = "6"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
mail-parser = "0.11"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"

# 授权码存进系统钥匙串，不落盘
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3" }

