[package]
name = "mailbeacon-app"
description = "MailBeacon 邮件客户端"
version = "0.15.0"
edition = "2024"

[lib]
# _lib 后缀：避免库名与二进制同名冲突，见 https://github.com/rust-lang/cargo/issues/8519
name = "mailbeacon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
anyhow = "1"
base64 = "0.22"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
chrono = "0.4"
dirs = "6"
dom_query = { version = "0.28", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tempfile = "3"
futures = "0.3"
icu_properties = "2.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
# GB2312/GBK、Big5 等旧编码的邮件头和正文需要完整字符集支持。
mailbeacon-parser = { path = "../vendor/mail-parser", features = ["full_encoding"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地数据：通讯录、模板、规则等（编译时自带 SQLite，不依赖系统库）
rusqlite = { version = "0.32", features = ["bundled"] }
# 本地凭据使用已有 TLS 依赖中的成熟 AEAD 与系统随机数实现。
ring = "0.17.14"
# 导入 GBK 编码的通讯录 CSV（163 等导出的文件）
encoding_rs = "0.8"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
# 测试里暂停时钟（start_paused），超时类的用例瞬间跑完
tokio = { version = "1", features = ["full", "test-util"] }

# 仅用于从旧版系统钥匙串迁移授权码；新凭据由本地加密存储管理。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSFileManager", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3" }

