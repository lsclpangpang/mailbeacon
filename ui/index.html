<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <script>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
