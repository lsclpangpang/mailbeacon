<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailBeacon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="compose-session.css">
  <link rel="stylesheet" href="productivity.css">
  <script>
    // 在普通浏览器里打开时（预览界面用）加载假数据；App 里 window.__TAURI__ 由 Tauri 注入
    if (!window.__TAURI__) document.write('<script src="mock.js"><\/script>');
  </script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="list" id="list"></section>
    <main class="reader" id="reader"></main>
    <div id="list-splitter" class="list-splitter" role="separator" aria-orientation="vertical"
         title="拖动调整列表宽度，双击恢复默认"></div>
  </div>
  <div id="side-hotzone" class="side-hotzone" aria-hidden="true"></div>
  <button id="rail-expand" class="icon-btn rail-expand" data-action="toggle-sidebar"
          title="展开侧栏" aria-label="展开侧栏" aria-pressed="true"></button>
  <div id="overlay"></div>
  <div id="compose-host" hidden></div>
  <div id="compose-dock" class="compose-dock" hidden aria-label="待继续的草稿"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="compose-editor.js"></script>
  <script src="recipients.js"></script>
  <script src="views.js"></script>
  <script src="prefs.js"></script>
  <script src="body-cache.js"></script>
  <script src="rules.js"></script>
  <script src="threads.js"></script>
  <script src="compose-extras.js"></script>
  <script src="compose-quote.js"></script>
  <script src="compose-draft.js"></script>
  <script src="compose-session.js"></script>
  <script src="notification-open.js"></script>
  <script src="reader-nav.js"></script>
  <script src="reader-motion.js"></script>
  <script src="mail-selection.js"></script>
  <script src="mail-operations.js"></script>
  <script src="dropdown.js"></script>
  <script src="send-records.js"></script>
  <script src="account-repair.js"></script>
  <script src="mail-search.js"></script>
  <script src="native-menu.js"></script>
  <script src="attachment-center.js"></script>
  <script src="productivity-panels.js"></script>
  <script src="app.js"></script>
</body>
</html>
