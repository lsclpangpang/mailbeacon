# Vendored from mail-parser 0.11.9; local package name mailbeacon-parser.
# See MAILPULSE-PATCH.md. Unused upstream optional features (rkyv/serde/base64_slice)
# and example/test targets were dropped so the workspace lockfile stays lean.

[package]
edition = "2024"
name = "mailbeacon-parser"
version = "0.11.9"
authors = ["Stalwart Labs <hello@stalw.art>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast and robust e-mail parsing library for Rust"
homepage = "https://github.com/stalwartlabs/mail-parser"
readme = "README.md"
keywords = [
    "email",
    "mail",
    "parser",
    "parse",
    "mime",
]
categories = [
    "email",
    "parser-implementations",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/mail-parser"

[features]
default = []
full_encoding = ["encoding_rs"]

[lib]
name = "mailbeacon_parser"
path = "src/lib.rs"
doctest = false

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.hashify]
version = "0.2"
